[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mssp-pipeline"
version = "0.1.0"
description = "Download and process MSSP ACO Datahub files — end-to-end pipeline"
requires-python = ">=3.10"
# Core install includes only the download subsystem dependencies.
# Add optional groups for the processing backends you need.
dependencies = [
    "boto3>=1.34",
    "azure-identity",
    "azure-storage-blob",
    "google-cloud-storage",
    "python-dotenv>=1.0",
]

[project.scripts]
mssp-download = "mssp_pipeline.__main__:download_main"
mssp-process  = "mssp_pipeline.__main__:process_main"
mssp-pipeline = "mssp_pipeline.__main__:pipeline_main"
mssp-validate = "mssp_pipeline.__main__:validate_main"
mssp-runs     = "mssp_pipeline.__main__:runs_main"

[project.optional-dependencies]
# Core DuckDB processing engine (required for mssp-process / mssp-pipeline)
processing = [
    "duckdb",
    "openpyxl",
]
# Cloud output backends — install only what you need
snowflake = [
    "snowflake-connector-python",
    "cryptography",
    "keyring",
]
databricks = [
    "databricks-sql-connector",
    "databricks-sdk",
]
bigquery = [
    "google-cloud-bigquery",
    "google-cloud-storage",
]
redshift = [
    "boto3>=1.34",
    "redshift-connector",
]
azure = [
    "azure-identity",
    "azure-storage-blob",
]
fabric = [
    "deltalake",
    "azure-identity",
    "azure-storage-blob",
]
# Install everything
all = [
    "duckdb",
    "openpyxl",
    "snowflake-connector-python",
    "cryptography",
    "keyring",
    "databricks-sql-connector",
    "databricks-sdk",
    "google-cloud-bigquery",
    "google-cloud-storage",
    "boto3>=1.34",
    "redshift-connector",
    "azure-identity",
    "azure-storage-blob",
    "deltalake",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "duckdb",
    "openpyxl",
    "azure-identity",
    "azure-storage-blob",
    "google-cloud-storage",
    # The Snowflake exporter's tests import the connector directly. Production
    # still imports it lazily in build_exporter, so a minimal install needs no
    # cloud SDKs; the test suite does.
    "snowflake-connector-python",
    "cryptography",
    "keyring",
]

[tool.hatch.build.targets.wheel]
packages = ["mssp_pipeline"]
artifacts = ["bin/acoms-cli"]
